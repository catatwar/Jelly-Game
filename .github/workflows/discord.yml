# Jelly Critters Discord bot (Made By Cat At War)
# Posts what the dev account sends from the game. Runs when the game starts it, and every 15 minutes as a backup.
name: Discord posts

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

# one run at a time, so nothing ever posts twice
concurrency:
  group: discord-posts
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/discord
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node .github/discord/post.mjs
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
